# Deployment template: replace secret placeholders in DigitalOcean before deployment.
# PostgreSQL and a private Spaces bucket must be provisioned separately.
name: petish
region: sgp
services:
  - name: web
    github:
      repo: muslim5562/petish
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/healthz
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PETISH_DEMO
        scope: RUN_TIME
        value: "false"
      - key: PETISH_PHONE_PREVIEW
        scope: RUN_TIME
        value: "false"
      - key: BETTER_AUTH_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: BETTER_AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: STORAGE_DRIVER
        scope: RUN_TIME
        value: s3
      - key: S3_ENDPOINT
        scope: RUN_TIME
        value: https://sgp1.digitaloceanspaces.com
      - key: S3_REGION
        scope: RUN_TIME
        value: sgp1
      - key: S3_BUCKET
        scope: RUN_TIME
        value: REPLACE_ME
      - key: S3_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: S3_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: MAIL_MODE
        scope: RUN_TIME
        value: resend
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: MAIL_FROM
        scope: RUN_TIME
        value: Petish <muslim@ivirtual.com.my>
      - key: LOST_FOUND_MODERATOR_EMAILS
        scope: RUN_TIME
        value: muslim@ivirtual.com.my
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
